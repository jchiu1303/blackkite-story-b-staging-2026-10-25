<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Black Kite — Shop mocks (mockup)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@500;600&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --ground: #100e0c;
      --cream: #f7f1ea;
      --mute: #d4c4b0;
      --panel: #1a1612;
      --film: #0c0b09;
      --chip: rgba(247,241,234,.35);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: Outfit, "Noto Sans TC", "PingFang HK", "Noto Sans CJK TC", sans-serif;
      background: var(--ground);
      color: var(--cream);
      min-height: 100vh;
    }
    .badge {
      position: fixed;
      top: 12px;
      right: 12px;
      z-index: 80;
      background: var(--film);
      color: var(--cream);
      font-family: Outfit, "Noto Sans TC", sans-serif;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.06em;
      padding: 8px 12px;
      border: 1px solid var(--chip);
    }
    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 72px 24px 64px;
    }
    h1 {
      font-family: Outfit, "Noto Sans TC", sans-serif;
      font-size: clamp(28px, 5vw, 48px);
      font-weight: 500;
      letter-spacing: 0;
      line-height: 0.95;
      margin: 0 0 12px;
    }
    .lede {
      font-family: Newsreader, "Noto Serif TC", Georgia, serif;
      color: var(--mute);
      font-size: 18px;
      line-height: 1.45;
      margin: 0 0 36px;
    }
    nav {
      display: flex;
      flex-direction: column;
      gap: 1px;
      background: var(--chip);
      border: 1px solid var(--chip);
    }
    nav a {
      display: block;
      background: var(--panel);
      color: var(--cream);
      text-decoration: none;
      padding: 18px 20px;
      font-size: 16px;
      font-weight: 500;
    }
    nav a:hover,
    nav a:focus-visible {
      background: var(--film);
    }
  </style>
</head>
<body>
  <div class="badge">MOCKUP</div>
  <main>
    <h1>Shop mocks</h1>
    <p class="lede">These pages are mocks only. They are not live or staging, and they are not publishable.</p>
    <nav>
      <a href="../shop-clickthrough-2026-11-12/">Cooler shelf</a>
      <a href="graza-tighten/">Graza tighten</a>
      <a href="iron-goddess/">Iron Goddess</a>
      <a href="flower-market/">Flower Market</a>
    </nav>
  </main>
</body>
</html>
